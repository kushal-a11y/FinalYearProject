<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Complete Your Profile · Shubh Vivah</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--maroon:#8e1f3d;--maroon-dk:#6f1530;--rose:#d4526e;--gold:#c8a04a;--ink:#2c2126;--muted:#8a7a80;--card:#fffdfa;--line:#ecdfd4}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Jost',sans-serif;color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
      background:radial-gradient(900px 500px at 10% 0%,rgba(212,82,110,.16),transparent 55%),
        radial-gradient(800px 500px at 100% 100%,rgba(200,160,74,.18),transparent 55%),
        linear-gradient(155deg,#fbf6ef,#f6e8e0 60%,#f2dee3)}
    .wrap{width:100%;max-width:520px;position:relative;z-index:2}
    .progress{margin-bottom:30px;text-align:center;animation:fade .6s both}
    .ptext{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--maroon);font-weight:600;margin-bottom:12px}
    .pbar{height:6px;background:#efe2da;border-radius:99px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.06)}
    .pfill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--rose),var(--maroon));transition:width .55s cubic-bezier(.4,0,.2,1)}
    .stage{position:relative;min-height:340px;display:flex;align-items:center;justify-content:center}
    .modal{position:absolute;width:100%;background:var(--card);padding:46px 38px;border-radius:22px;border:1px solid var(--line);
      box-shadow:0 30px 70px -34px rgba(110,21,48,.45);text-align:center;
      opacity:0;transform:translateY(22px) scale(.97);transition:all .45s cubic-bezier(.4,0,.2,1);pointer-events:none}
    .modal.active{opacity:1;transform:none;pointer-events:auto}
    .icon{font-size:30px;margin-bottom:6px}
    h3{font-family:'Playfair Display',serif;font-size:27px;color:var(--maroon);font-weight:700}
    .sub{font-size:13px;color:var(--muted);margin:7px 0 26px;font-weight:300}
    input,select{width:100%;padding:14px 15px;border:1.5px solid var(--line);border-radius:12px;font-size:15px;font-family:'Jost',sans-serif;
      background:#fffdfb;color:var(--ink);transition:.25s;margin-bottom:8px}
    input:focus,select:focus{outline:none;border-color:var(--rose);background:#fff;box-shadow:0 0 0 4px rgba(212,82,110,.14)}
    .sel{position:relative}
    .sel::after{content:"▾";position:absolute;right:16px;top:13px;color:var(--rose);pointer-events:none}
    select{appearance:none;-webkit-appearance:none;cursor:pointer}
    .btns{display:flex;gap:12px;margin-top:18px}
    button{padding:13px 26px;border:none;border-radius:12px;cursor:pointer;font-family:'Jost',sans-serif;font-weight:600;font-size:14px;letter-spacing:.04em;transition:.25s}
    .primary{flex:1;color:#fff;background:linear-gradient(135deg,var(--rose),var(--maroon));box-shadow:0 12px 26px -12px rgba(142,31,61,.8)}
    .primary:hover{transform:translateY(-2px)} .primary:disabled{opacity:.6;cursor:wait;transform:none}
    .skip{background:#f3eae4;color:var(--muted)} .skip:hover{background:#ecdfd6;color:var(--ink)}
    .hint{font-size:12.5px;color:var(--muted);margin:-2px 0 14px;line-height:1.5}
    .feedback{font-size:13.5px;margin-top:6px;min-height:1.2em;line-height:1.45}
    .ok{color:#1d7a3a}.bad{color:#a8243b}
    /* avatar uploader */
    .av{width:130px;height:130px;border-radius:50%;margin:0 auto 18px;position:relative;cursor:pointer;
      background:#f6ece6;border:2px dashed var(--rose);display:grid;place-items:center;overflow:hidden;transition:.25s}
    .av:hover{border-color:var(--maroon);background:#f9e7ea}
    .av img{width:100%;height:100%;object-fit:cover;display:none}
    .av .ph{color:var(--rose);font-size:13px;text-align:center;padding:0 10px}
    .av.has img{display:block}.av.has .ph{display:none}
    /* pan badge */
    .pan-input{text-transform:uppercase;letter-spacing:.28em;text-align:center;font-weight:600}
    .verified-chip{display:inline-flex;align-items:center;gap:7px;background:#eafaf0;color:#1d7a3a;border:1px solid #b6e6c5;
      padding:9px 16px;border-radius:99px;font-size:14px;font-weight:600;margin-top:6px}
    .done{padding:34px 12px}.done .big{font-size:54px;line-height:1;color:var(--gold);margin-bottom:10px}
    @keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    @media(max-width:480px){.modal{padding:36px 24px}.btns{flex-direction:column}.skip{order:2}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="progress">
    <div class="ptext"><span id="cur">1</span> &nbsp;/&nbsp; <span id="tot">12</span> &middot; Building your profile</div>
    <div class="pbar"><div class="pfill" id="pfill"></div></div>
  </div>
  <div class="stage" id="stage"></div>
</div>

<script>
  const userId="{{ user_id }}";
  const casteList=["Brahmin","SC","OBC","Baisya","Kayastha","Banerjee","General","Tili","Barujibi","Kumbhakar","Swarnakar","Napit","Namasudra","Sunni","Sadgop","Goala","Kandi","Tambuli","Mukherjee","Roy","Biswas","Chatterjee","Dutta","Banik","Ganguly","Bhattacharya","Aguri","Malakar","Yadav"];
  const educationList=["B.Tech MBA","MBA","B.Tech","BSc","BA","MA B.Ed","MA","MSC B.Ed","BA B.Ed","PhD","Bcom","LLB","LLM"];
  const professionList=["20LPA","12LPA","15LPA","MNC-IT","IT","Research-Scholar-germany","Business","Bank","Pharma Co B'loe","Law Firm","Hospital Nurse","Advocate","College lecturer","Digital Marketing B'lore"];

  const fields=[
    {key:"name",label:"Your Name",icon:"✍️",type:"text",ph:"Enter your full name"},
    {key:"age",label:"Your Age",icon:"🎂",type:"number",ph:"e.g. 27"},
    {key:"gender",label:"Gender",icon:"⚥",type:"select",options:["Select Gender","Male","Female","Other"]},
    {key:"phone",label:"Phone Number",icon:"📞",type:"tel",ph:"+91 98765 43210"},
    {key:"education",label:"Education",icon:"🎓",type:"hybrid",list:educationList,ph:"Type or select education"},
    {key:"profession",label:"Profession",icon:"💼",type:"hybrid",list:professionList,ph:"Type or select profession"},
    {key:"caste",label:"Caste",icon:"🛕",type:"hybrid",list:casteList,ph:"Type or select caste"},
    {key:"religion",label:"Religion",icon:"🕊️",type:"text",ph:"Enter your religion"},
    {key:"residence",label:"Residence",icon:"📍",type:"text",ph:"Your city / town"},
    {key:"height_cm",label:"Height (cm)",icon:"📏",type:"number",ph:"e.g. 168"},
    {key:"__photo",label:"Profile Photo",icon:"📷",type:"photo"},
    {key:"__pan",label:"Identity Verification",icon:"🛡️",type:"pan"}
  ];

  let idx=0; const formData={}; let panVerified=false;
  document.getElementById('tot').textContent=fields.length;

  function setProgress(){document.getElementById('pfill').style.width=((idx+1)/fields.length*100)+'%';document.getElementById('cur').textContent=idx+1;}
  const last=()=>idx===fields.length-1;

  function render(){
    const f=fields[idx]; let inner='';
    if(f.type==='photo'){
      inner=`
        <div class="av" id="av" onclick="document.getElementById('file').click()">
          <img id="preview"><div class="ph">Tap to upload<br>a clear photo</div>
        </div>
        <input type="file" id="file" accept="image/*" style="display:none" onchange="onPick(event)">
        <p class="hint">A friendly, recent photo helps you get better responses. PNG / JPG, up to 5&nbsp;MB.</p>
        <div class="feedback" id="fb"></div>
        <div class="btns">
          <button class="primary" id="go" onclick="uploadPhoto()">Upload &amp; Continue</button>
          <button class="skip" onclick="next()">Skip</button>
        </div>`;
    } else if(f.type==='pan'){
      inner=`
        <input class="pan-input" id="pan" maxlength="10" placeholder="ABCDE1234F" oninput="this.value=this.value.toUpperCase()">
        <p class="hint">Your PAN is checked against the official structure &amp; ownership rules to keep the community genuine. We store it securely and never show it to others.</p>
        <div class="feedback" id="fb"></div>
        <div class="btns">
          <button class="primary" id="go" onclick="verifyPan()">Verify PAN</button>
          <button class="skip" onclick="finish()">Skip for now</button>
        </div>`;
    } else if(f.type==='select'){
      inner=`<div class="sel"><select id="inp">${f.options.map(o=>`<option value="${o===f.options[0]?'':o}">${o}</option>`).join('')}</select></div>
        <div class="btns"><button class="primary" onclick="save()">${last()?'Finish':'Save &amp; Next'}</button>${last()?'':'<button class="skip" onclick="next()">Skip</button>'}</div>`;
    } else if(f.type==='hybrid'){
      inner=`<input list="dl" id="inp" placeholder="${f.ph}"><datalist id="dl">${f.list.map(o=>`<option value="${o}">`).join('')}</datalist>
        <div class="btns"><button class="primary" onclick="save()">${last()?'Finish':'Save &amp; Next'}</button>${last()?'':'<button class="skip" onclick="next()">Skip</button>'}</div>`;
    } else {
      inner=`<input type="${f.type}" id="inp" placeholder="${f.ph}">
        <div class="btns"><button class="primary" onclick="save()">${last()?'Finish':'Save &amp; Next'}</button>${last()?'':'<button class="skip" onclick="next()">Skip</button>'}</div>`;
    }
    document.getElementById('stage').innerHTML=`<div class="modal active"><div class="icon">${f.icon}</div><h3>${f.label}</h3><div class="sub">Step ${idx+1} of ${fields.length}</div>${inner}</div>`;
    setProgress();
    const ip=document.getElementById('inp'); if(ip){ip.focus(); ip.addEventListener('keydown',e=>{if(e.key==='Enter')save();});}
  }

  function save(){
    const f=fields[idx],el=document.getElementById('inp'),v=el.value.trim();
    if(!v){el.style.borderColor='#e0a0ab';el.focus();return;}
    formData[f.key]=v; next();
  }
  function next(){ if(idx<fields.length-1){idx++;render();} else finish(); }

  /* ---- photo ---- */
  let pickedFile=null;
  function onPick(e){
    const file=e.target.files[0]; if(!file)return;
    pickedFile=file; const r=new FileReader();
    r.onload=ev=>{document.getElementById('preview').src=ev.target.result;document.getElementById('av').classList.add('has');};
    r.readAsDataURL(file);
  }
  async function uploadPhoto(){
    if(!pickedFile){document.getElementById('fb').innerHTML='<span class="bad">Please choose a photo first, or Skip.</span>';return;}
    const go=document.getElementById('go'); go.disabled=true; go.textContent='Uploading…';
    const fd=new FormData(); fd.append('image',pickedFile);
    try{
      const res=await fetch(`/user/upload-image/${userId}`,{method:'POST',body:fd});
      const r=await res.json();
      if(res.ok){document.getElementById('fb').innerHTML='<span class="ok">✓ Photo uploaded</span>';setTimeout(next,650);}
      else{go.disabled=false;go.textContent='Upload & Continue';document.getElementById('fb').innerHTML=`<span class="bad">${r.error||'Upload failed'}</span>`;}
    }catch(e){go.disabled=false;go.textContent='Upload & Continue';document.getElementById('fb').innerHTML='<span class="bad">Server error. Try again.</span>';}
  }

  /* ---- pan ---- */
  async function verifyPan(){
    const pan=document.getElementById('pan').value.trim();
    const fb=document.getElementById('fb'),go=document.getElementById('go');
    if(!pan){fb.innerHTML='<span class="bad">Please enter your PAN.</span>';return;}
    go.disabled=true; go.textContent='Verifying…';
    try{
      const res=await fetch(`/user/verify-pan/${userId}`,{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({pan,full_name:formData.name||''})});
      const r=await res.json();
      if(res.ok&&r.verified){
        panVerified=true;
        fb.innerHTML=`<span class="verified-chip">🛡️ Verified · ${r.entity_type||'Individual'} (${r.pan_masked})</span>`;
        go.textContent='Verified ✓';
        setTimeout(finish,1200);
      }else{
        go.disabled=false; go.textContent='Verify PAN';
        fb.innerHTML=`<span class="bad">${r.error||'Verification failed.'}</span>`;
      }
    }catch(e){go.disabled=false;go.textContent='Verify PAN';fb.innerHTML='<span class="bad">Server error. Try again.</span>';}
  }

  function showDone(){
    document.getElementById('stage').innerHTML=`<div class="modal active"><div class="done">
      <div class="big">❦</div><h3>Profile Complete!</h3>
      <div class="sub" style="font-size:14px">${panVerified?'Your identity is verified. ':''}Taking you to your dashboard…</div></div></div>`;
    document.getElementById('pfill').style.width='100%';
  }

  async function finish(){
    showDone();
    try{
      await fetch(`/user/complete-profile/${userId}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(formData)});
    }catch(e){console.error(e);}
    setTimeout(()=>window.location.href=`/user/dashboard/${userId}`,1700);
  }

  render();
</script>
</body>
</html>
